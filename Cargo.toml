[package]
name = "rhodopsin"
version = "0.2.0"
edition = "2024"
description = "CLI and Rust library for converting PPTX to PNG or PDF without Office (early implementation)"
license = "MIT"
repository = "https://github.com/stellar-aiz/rhodopsin"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
resvg = "0.48.1"
rhodopsin-xlsx = { path = "crates/xlsx", version = "0.1.0" }
roxmltree = "0.21"
imagesize = "0.15"
miniz_oxide = "0.8"
png = "0.18"
skrifa = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zune-jpeg = "0.5.9"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["crates/xlsx"]
